syntax = "proto3";

package xray.proxy.gless;
option csharp_namespace = "Xray.Proxy.Gless";
option go_package = "github.com/xtls/xray-core/proxy/gless";
option java_package = "com.xray.proxy.gless";
option java_multiple_files = true;

message Account {
  // ID of the account, in the form of a UUID, e.g., "66ad4540-b58c-4ad2-9926-ea63445a9b57".
  string id = 1;
  // Flow settings. May be "gost-rprx-vision".
  string flow = 2;
  // Encryption settings. Only applies to client side, and only accepts "none" for now.
  string encryption = 3;
} 